name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 检出源码 ----------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      # ---------- 2. 并行下载两个 SDK ----------
      - name: Download SDKs (parallel)
        run: |
          SDK23_REL="releases/23.05.4/targets/x86/64/immortalwrt-sdk-23.05.4-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          SDK25_REL="releases/25.12.0/targets/x86/64/immortalwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          # 官方源卡住时自动回退镜像; 低速/断流自动重试并断点续传
          SDK_BASES="https://downloads.immortalwrt.org https://mirrors.ustc.edu.cn/immortalwrt https://mirror.sjtu.edu.cn/immortalwrt"

          fetch_sdk() {
            local rel="$1" out="$2"
            for base in $SDK_BASES; do
              echo ">>> downloading $base/$rel"
              if curl -fsSL --connect-timeout 30 --speed-limit 102400 --speed-time 60 \
                   --retry 3 --retry-delay 10 --retry-all-errors -C - -o "$out" "$base/$rel"; then
                return 0
              fi
              rm -f "$out"
            done
            return 1
          }

          # 并行下载
          fetch_sdk "$SDK23_REL" sdk23.tar.xz &
          PID23=$!
          fetch_sdk "$SDK25_REL" sdk25.tar.zst &
          PID25=$!
          wait "$PID23" || { echo "❌ SDK 23.05 download failed"; exit 1; }
          wait "$PID25" || { echo "❌ SDK 25.12 download failed"; exit 1; }
          echo "✅ SDKs downloaded"
          ls -lh sdk23.tar.xz sdk25.tar.zst
      - name: Extract SDKs
        run: |
          # 串行解压（避免移动时的竞态）
          tar -xf sdk23.tar.xz && mv immortalwrt-sdk-* sdk23
          tar --zstd -xf sdk25.tar.zst && mv immortalwrt-sdk-* sdk25
          echo "✅ SDKs extracted"

      # ============================================================
      # 编译 .ipk (opkg) - SDK 23.05
      # ============================================================
      - name: Copy package to SDK 23.05
        run: |
          mkdir -p sdk23/package/luci-app-online-upgrade
          cp -r package-dir/* sdk23/package/luci-app-online-upgrade/

      - name: Install feeds (SDK 23.05)
        run: |
          cd sdk23
          # luci 包的编译依赖头文件 (lua.h / ucode/module.h / netlink/msg.h) 来自 packages feed
          ./scripts/feeds update luci packages
          ./scripts/feeds install -a
          make defconfig

      - name: Build .ipk
        id: build_ipk
        run: |
          cd sdk23
          make -j$(nproc) package/luci-app-online-upgrade/compile V=s

      - name: Save .ipk
        run: |
          mkdir -p /tmp/pkgs
          find sdk23/bin/ -name "luci-app-online-upgrade*.ipk" -exec cp {} /tmp/pkgs/ \;
          echo "=== .ipk artifacts ==="
          ls -lh /tmp/pkgs/*.ipk 2>/dev/null || echo "(no .ipk)"

      # ============================================================
      # 编译 .apk (APK) - SDK 25.12
      # ============================================================
      - name: Copy package to SDK 25.12
        run: |
          mkdir -p sdk25/package/luci-app-online-upgrade
          cp -r package-dir/* sdk25/package/luci-app-online-upgrade/

      - name: Install feeds (SDK 25.12)
        run: |
          cd sdk25
          # luci 包的编译依赖头文件 (lua.h / ucode/module.h / netlink/msg.h) 来自 packages feed
          ./scripts/feeds update luci packages
          ./scripts/feeds install -a
          make defconfig

      - name: Build .apk
        id: build_apk
        run: |
          cd sdk25
          make -j$(nproc) package/luci-app-online-upgrade/compile V=s

      - name: Save .apk
        run: |
          find sdk25/bin/ -name "luci-app-online-upgrade*.apk" -exec cp {} /tmp/pkgs/ \;
          echo "=== All artifacts ==="
          ls -lh /tmp/pkgs/

      # ============================================================
      # 上传到 Release
      # ============================================================
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: v2.0.${{ github.run_number }}
          body: |
            自动编译的插件包

            - ✅ .ipk (opkg) — 适用于 ImmortalWrt 23.05 及更早
            - ✅ .apk (APK) — 适用于 ImmortalWrt 25.12+
          files: /tmp/pkgs/*
          token: ${{ github.token }}
          make_latest: true
